name: CI

# Runs on every PR (incl. external forks — read-only token, no secrets) and on
# pushes to main. This is the check the "Protect" ruleset requires before merge,
# so external contributions can't land on main with failing types/lint/tests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
